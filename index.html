<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f4">
  <title>Mosso Panel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css?v=202610241131">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="logo.svg" alt="Mosso Sigorta" width="96" height="78">
        <span class="sr-only" id="brandName">Mosso Sigorta</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="small" id="whoami" hidden></div>
        <button class="btn ghost sm" id="lockBtn" type="button" data-icon="lock">Kilitle</button>
        <button class="btn ghost sm" id="logoutBtn" type="button" hidden data-icon="logout">Çıkış yap</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <img class="topbar-mark" src="mark.svg" alt="Mosso Sigorta" width="40" height="28">
        <div class="search-wrap">
          <input id="globalSearch" type="search" placeholder="Ara: isim, telefon, plaka, TC, poliçe no…" autocomplete="off">
          <div id="searchResults" class="search-results" hidden></div>
        </div>
        <button type="button" id="syncStatus" class="sync-pill" hidden></button>
        <div class="quick-add">
          <button class="btn primary" id="quickAddBtn" type="button" data-icon="plus"><span class="hide-sm">Yeni</span></button>
          <div class="menu" id="quickAddMenu" hidden>
            <button data-new="quote" data-icon="clipboard">Teklif talebi</button>
            <button data-new="policy" data-icon="file">Poliçe</button>
            <button data-new="customer" data-icon="user">Müşteri</button>
            <button data-new="claim" data-icon="shield">Hasar dosyası</button>
            <button data-new="task" data-icon="check-square">Görev</button>
          </div>
        </div>
      </header>
      <main id="view"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <div id="lockScreen" hidden>
    <form class="lock-card" id="lockForm">
      <img class="auth-logo" src="logo.svg" alt="Mosso Sigorta" width="110" height="90">
      <h2>Panel kilitli</h2>
      <p class="muted">Devam etmek için PIN kodunuzu girin</p>
      <input id="lockPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required>
      <button class="btn primary block" type="submit">Aç</button>
      <p class="err" id="lockErr" hidden>PIN hatalı</p>
    </form>
  </div>

  <script src="config.js?v=202610241131"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="cloud.js?v=202610241131"></script>
  <script src="app.js?v=202610241131"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
