<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16324f">
  <title>Mosso Panel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-name" id="brandName">Mosso Sigorta</div>
          <div class="brand-sub">Acente Paneli</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="small" id="whoami" hidden></div>
        <button class="btn ghost sm" id="lockBtn" type="button">🔒 Kilitle</button>
        <button class="btn ghost sm" id="logoutBtn" type="button" hidden>↩ Çıkış yap</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="search-wrap">
          <input id="globalSearch" type="search" placeholder="Ara: isim, telefon, plaka, TC, poliçe no…" autocomplete="off">
          <div id="searchResults" class="search-results" hidden></div>
        </div>
        <button type="button" id="syncStatus" class="sync-pill" hidden></button>
        <div class="quick-add">
          <button class="btn primary" id="quickAddBtn" type="button">＋ <span class="hide-sm">Yeni</span></button>
          <div class="menu" id="quickAddMenu" hidden>
            <button data-new="quote">📝 Teklif talebi</button>
            <button data-new="policy">📄 Poliçe</button>
            <button data-new="customer">👤 Müşteri</button>
            <button data-new="claim">🛠️ Hasar dosyası</button>
            <button data-new="task">✅ Görev</button>
          </div>
        </div>
      </header>
      <main id="view"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <div id="lockScreen" hidden>
    <form class="lock-card" id="lockForm">
      <div class="brand-mark lg">M</div>
      <h2>Panel kilitli</h2>
      <p class="muted">Devam etmek için PIN kodunuzu girin</p>
      <input id="lockPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required>
      <button class="btn primary block" type="submit">Aç</button>
      <p class="err" id="lockErr" hidden>PIN hatalı</p>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
